<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f8" />
    <meta
      name="description"
      content="사진과 방향 안내를 따라 지하철역 안을 편하게 이동하는 Metro-Guide AR"
    />
    <title>Metro-Guide AR | 역 안 길안내</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172a3a;
        --muted: #748394;
        --blue: #1769e0;
        --lime: #d7ed73;
        --page: #10191e;
        font-family: Inter, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100svh; margin: 0; background: var(--page); color: #fff; }
      button { color: inherit; font: inherit; }
      [hidden] { display: none !important; }
      .app { min-height: 100svh; }
      .topbar { position: absolute; z-index: 4; inset: 30px 34px auto; display: flex; align-items: start; justify-content: space-between; gap: 20px; pointer-events: none; }
      .brand { display: flex; align-items: center; gap: 13px; }
      .brand-icon { display: grid; width: 43px; height: 43px; place-items: center; border: 1px solid rgb(255 255 255 / 45%); border-radius: 50%; background: rgb(255 255 255 / 14%); color: var(--lime); font-size: 20px; backdrop-filter: blur(8px); }
      .brand-name { display: grid; gap: 4px; padding-top: 3px; text-shadow: 0 1px 9px rgb(0 0 0 / 38%); }
      .brand-name strong { font-size: 17px; letter-spacing: -.04em; }
      .brand-name span { color: rgb(255 255 255 / 76%); font-size: 10px; letter-spacing: .09em; }
      .back-to-search { display: inline-flex; min-height: 42px; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid rgb(255 255 255 / 35%); background: rgb(16 25 30 / 60%); color: #fff; cursor: pointer; font-size: 12px; font-weight: 650; pointer-events: auto; backdrop-filter: blur(8px); }
      .back-to-search:hover { background: rgb(16 25 30 / 82%); }
      .search-screen { min-height: 100svh; padding: 34px 22px 48px; background: #f5f7fa; color: var(--ink); }
      .search-content { width: min(100%, 560px); margin: 0 auto; }
      .search-brand { display: flex; align-items: center; gap: 11px; margin-bottom: clamp(62px, 13vh, 118px); }
      .search-brand .brand-icon { width: 40px; height: 40px; border: 0; background: var(--blue); color: #fff; font-size: 21px; }
      .search-brand .brand-name { text-shadow: none; }
      .search-brand .brand-name strong { color: var(--ink); }
      .search-brand .brand-name span { color: var(--muted); }
      .search-heading { margin: 0; font-size: clamp(30px, 7vw, 42px); font-weight: 750; letter-spacing: -.07em; }
      .search-description { margin: 10px 0 30px; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .search-form { position: relative; }
      .search-icon { position: absolute; top: 50%; left: 17px; width: 21px; height: 21px; color: #7d8b9b; pointer-events: none; transform: translateY(-50%); }
      .station-search { width: 100%; height: 58px; padding: 0 18px 0 49px; border: 1px solid #dfe5ec; border-radius: 13px; outline: none; background: #fff; color: var(--ink); font: inherit; font-size: 15px; box-shadow: 0 5px 16px rgb(23 42 58 / 4%); transition: border-color .2s, box-shadow .2s; }
      .station-search::placeholder { color: #a0aab6; }
      .station-search:focus { border-color: #73a4ed; box-shadow: 0 0 0 4px rgb(23 105 224 / 10%); }
      .results-heading { display: flex; align-items: center; justify-content: space-between; margin: 31px 2px 12px; color: #526579; font-size: 12px; font-weight: 700; }
      .results-heading span:last-child { color: #929eaa; font-size: 11px; font-weight: 500; }
      .station-results { display: grid; gap: 10px; }
      .station-result { display: flex; width: 100%; min-height: 82px; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid #e6ebf0; border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; text-align: left; box-shadow: 0 4px 13px rgb(23 42 58 / 3%); transition: border-color .18s, transform .18s, box-shadow .18s; }
      .station-result:hover { border-color: #b7cfee; box-shadow: 0 7px 20px rgb(23 42 58 / 8%); transform: translateY(-1px); }
      .station-result:focus-visible { outline: 3px solid #8fc1ff; outline-offset: 3px; }
      .line-number { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: #72b544; color: #fff; font-size: 17px; font-weight: 800; }
      .station-result-copy { display: grid; flex: 1; gap: 5px; }
      .station-result-copy strong { font-size: 15px; letter-spacing: -.03em; }
      .station-result-copy span { color: var(--muted); font-size: 11px; }
      .result-arrow { color: #91a0b0; font-size: 21px; }
      .empty-results { padding: 24px 16px; border: 1px dashed #d6dee7; border-radius: 13px; color: #718094; font-size: 13px; text-align: center; }
      .search-footnote { margin: 19px 3px 0; color: #98a3af; font-size: 11px; line-height: 1.7; }
      main { min-height: 100svh; }
      .viewer { position: relative; overflow: hidden; width: 100%; min-height: 540px; height: 100svh; background: #253747; isolation: isolate; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; transition: opacity .24s ease, transform .65s ease; }
      .scene.is-changing { opacity: .25; transform: scale(1.015); }
      .viewer::after { position: absolute; z-index: 1; inset: 0; background: linear-gradient(180deg, rgb(5 11 15 / 40%), transparent 25%, transparent 57%, rgb(5 11 15 / 59%)); content: ""; pointer-events: none; }
      .photo-tag { position: absolute; z-index: 2; top: 96px; left: 34px; display: grid; gap: 5px; color: #fff; text-shadow: 0 1px 8px rgb(0 0 0 / 45%); }
      .photo-tag span { color: rgb(255 255 255 / 72%); font-size: 10px; letter-spacing: .1em; }
      .photo-tag strong { font-size: 15px; }
      .direction-screen { display: grid; min-height: 100svh; place-items: center; padding: 24px; background: #f5f7fa; color: var(--ink); }
      .direction-content { width: min(100%, 520px); }
      .direction-back { margin-bottom: 36px; padding: 9px 0; border: 0; background: transparent; color: #526579; cursor: pointer; font-size: 13px; font-weight: 650; }
      .direction-heading { margin: 0; font-size: clamp(26px, 6vw, 36px); letter-spacing: -.06em; }
      .direction-description { margin: 10px 0 24px; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .direction-options { display: grid; gap: 12px; }
      .direction-choice { display: flex; min-height: 86px; align-items: center; justify-content: space-between; padding: 18px 20px; border: 1px solid #e1e7ee; border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; text-align: left; box-shadow: 0 4px 13px rgb(23 42 58 / 3%); }
      .direction-choice:hover { border-color: #b7cfee; box-shadow: 0 7px 20px rgb(23 42 58 / 8%); }
      .direction-choice:focus-visible { outline: 3px solid #8fc1ff; outline-offset: 3px; }
      .direction-choice span:first-child { display: grid; gap: 6px; }
      .direction-choice strong { font-size: 16px; }
      .direction-choice small { color: var(--muted); font-size: 12px; }
      .direction-choice .result-arrow { font-size: 24px; }
      .direction-controls { position: absolute; z-index: 3; top: 78%; left: 50%; width: min(100%, 420px); height: min(32vh, 260px); min-height: 200px; transform: translate(-50%, -50%); pointer-events: none; }
      .nav-arrow { position: absolute; display: grid; width: 64px; height: 64px; place-items: center; border: 2px solid rgb(255 255 255 / 82%); border-radius: 50%; background: rgb(255 255 255 / 94%); color: #283334; cursor: pointer; box-shadow: 0 4px 15px rgb(0 0 0 / 24%); transition: background .18s ease, color .18s ease, transform .18s ease, opacity .18s ease; pointer-events: auto; }
      .nav-up { top: 0; left: 50%; transform: translateX(-50%); }
      .nav-down { bottom: 0; left: 50%; transform: translateX(-50%); }
      .nav-left { top: 50%; left: 0; transform: translateY(-50%); }
      .nav-right { top: 50%; right: 0; transform: translateY(-50%); }
      .nav-up-left { top: 22%; left: 25%; transform: translate(-50%, -50%); }
      .nav-down-left { top: 78%; left: 25%; transform: translate(-50%, -50%); }
      .nav-up-right { top: 22%; right: 25%; transform: translate(50%, -50%); }
      .nav-down-right { top: 78%; right: 25%; transform: translate(50%, -50%); }
      .nav-arrow:hover:not(:disabled) { background: var(--lime); }
      .nav-arrow:focus-visible { outline: 3px solid var(--lime); outline-offset: 4px; }
      .nav-arrow svg { width: 25px; height: 25px; }
      .coupon-hotspot { position: absolute; z-index: 4; width: 190px; height: 74px; padding: 0; border: 0; background: transparent; cursor: pointer; transform: translate(-50%, -50%); }
      .coupon-hotspot img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .coupon-hotspot:focus-visible { outline: 3px solid #fff; outline-offset: 4px; border-radius: 50%; }
      .coupon-screen { position: absolute; z-index: 5; inset: 0; display: grid; place-items: center; padding: 24px; background: rgb(0 0 0 / 14%); }
      .coupon-card { position: relative; display: grid; width: min(48vw, 500px); max-width: calc(100vw - 64px); max-height: 82svh; place-items: center; }
      .coupon-image { display: block; width: 100%; max-height: 82svh; object-fit: contain; }
      .coupon-close { position: absolute; top: -18px; right: -18px; display: grid; width: 54px; height: 54px; place-items: center; border: 0; border-radius: 50%; background: #e53935; color: #111; cursor: pointer; font-size: 32px; font-weight: 500; line-height: 1; box-shadow: 0 3px 12px rgb(0 0 0 / 25%); }
      .coupon-close:hover { background: #f04a46; }
      .coupon-close:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
      .photo-error { position: absolute; z-index: 3; right: 16px; bottom: 18px; left: 16px; padding: 12px; background: rgb(70 15 15 / 90%); color: #fff; font-size: 13px; text-align: center; }
      @media (max-width: 700px) {
        .search-screen { padding: 22px 20px 36px; }
        .search-brand { margin-bottom: clamp(70px, 15vh, 124px); }
        .search-description { margin-bottom: 25px; font-size: 13px; }
        .station-search { height: 56px; }
        .results-heading { margin-top: 27px; }
        .station-result { min-height: 78px; }
        .viewer { min-height: 100svh; height: 100svh; }
        .topbar { inset: 18px 16px auto; }
        .brand { gap: 9px; }
        .brand-icon { width: 37px; height: 37px; }
        .brand-name strong { font-size: 14px; }
        .brand-name span { font-size: 8px; }
        .back-to-search { min-height: 38px; gap: 5px; padding: 0 10px; font-size: 11px; }
        .photo-tag { top: 20px; left: 16px; transform: translateY(57px); }
        .photo-tag strong { font-size: 13px; }
        .direction-controls { top: 78%; width: min(100% - 32px, 380px); height: min(30vh, 230px); min-height: 180px; }
        .nav-arrow { width: 56px; height: 56px; }
        .coupon-hotspot { width: 150px; height: 59px; }
        .coupon-screen { padding: 24px; }
        .coupon-card { width: min(68vw, 420px); max-width: calc(100vw - 64px); max-height: 78svh; }
        .coupon-image { max-height: 78svh; }
        .coupon-close { top: -14px; right: -14px; width: 46px; height: 46px; font-size: 28px; }
        .direction-content { padding: 12px 4px; }
      }

      @media (max-width: 380px) {
        .topbar { inset-inline: 12px; }
        .photo-tag { left: 12px; }
        .direction-controls { width: calc(100% - 28px); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main>
        <section class="search-screen" id="search-screen" aria-labelledby="search-title">
          <div class="search-content">
            <div class="search-brand" aria-label="Metro-Guide">
              <span class="brand-icon" aria-hidden="true">M</span>
              <span class="brand-name"><strong>Metro-Guide</strong><span>STATION WAYFINDING</span></span>
            </div>
            <h1 class="search-heading" id="search-title">지하철역 검색</h1>
            <p class="search-description">길안내를 시작할 역을 검색하고 선택해 주세요.</p>
            <form class="search-form" id="search-form" role="search">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8" />
                <path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <input
                class="station-search"
                id="station-search"
                type="search"
                placeholder="역 이름이나 호선을 입력하세요"
                autocomplete="off"
                aria-label="지하철역 검색"
                aria-controls="station-results"
              />
            </form>
            <div class="results-heading"><span>검색 가능한 역</span><span id="results-count">2개 역</span></div>
            <div class="station-results" id="station-results" aria-live="polite"></div>
            <p class="search-footnote">현재 길안내를 이용할 수 있는 역을 표시합니다.</p>
          </div>
        </section>

        <section class="direction-screen" id="journey-screen" aria-labelledby="journey-title" hidden>
          <div class="direction-content">
            <button class="direction-back" id="journey-back" type="button">← 역 검색</button>
            <h1 class="direction-heading" id="journey-title">승차 또는 하차를 선택해 주세요</h1>
            <p class="direction-description">온양온천역에서 이동할 내용을 선택해 주세요.</p>
            <div class="direction-options">
              <button class="direction-choice" type="button" data-journey="alight">
                <span><strong>승차</strong><small>열차 방향을 선택합니다</small></span><span class="result-arrow" aria-hidden="true">›</span>
              </button>
              <button class="direction-choice" type="button" data-journey="ride">
                <span><strong>하차</strong><small>이용할 출구를 선택합니다</small></span><span class="result-arrow" aria-hidden="true">›</span>
              </button>
            </div>
          </div>
        </section>

        <section class="direction-screen" id="exit-screen" aria-labelledby="exit-title" hidden>
          <div class="direction-content">
            <button class="direction-back" id="exit-back" type="button">← 승차·하차 선택</button>
            <h1 class="direction-heading" id="exit-title">출구를 선택해 주세요</h1>
            <p class="direction-description">하차 후 이동할 출구를 선택해 주세요.</p>
            <div class="direction-options">
              <button class="direction-choice" type="button" data-exit-start="38">
                <span><strong>1번 출구</strong></span><span class="result-arrow" aria-hidden="true">›</span>
              </button>
              <button class="direction-choice" type="button" data-exit-start="40">
                <span><strong>2번 출구</strong></span><span class="result-arrow" aria-hidden="true">›</span>
              </button>
            </div>
          </div>
        </section>

        <section class="direction-screen" id="direction-screen" aria-labelledby="direction-title" hidden>
          <div class="direction-content">
            <button class="direction-back" id="direction-back" type="button">← 승차·하차 선택</button>
            <h1 class="direction-heading" id="direction-title">지하철 방향을 선택해 주세요</h1>
            <p class="direction-description">1호선 온양온천역 승차 방향을 선택해 주세요.</p>
            <div class="direction-options">
              <button class="direction-choice" type="button" data-start-photo="1">
                <span><strong>아산 방향</strong><small>온양온천역 승강장 길안내</small></span><span class="result-arrow" aria-hidden="true">›</span>
              </button>
              <button class="direction-choice" type="button" data-start-photo="24">
                <span><strong>신창 방향</strong><small>온양온천역 승강장 길안내</small></span><span class="result-arrow" aria-hidden="true">›</span>
              </button>
            </div>
          </div>
        </section>

        <section id="guide-screen" aria-label="역 내부 길안내" hidden>
          <header class="topbar">
            <div class="brand" aria-label="역 안 길찾기">
              <span class="brand-icon" aria-hidden="true">↗</span>
              <span class="brand-name"><strong id="guide-station-name">온양온천역 길안내</strong><span>STATION STREET VIEW</span></span>
            </div>
            <button class="back-to-search" id="back-to-search" type="button" aria-label="역 선택으로 돌아가기">
              <span aria-hidden="true">←</span> 역 선택
            </button>
          </header>
          <section class="viewer" aria-label="역 내부 길안내 사진">
          <img
            class="scene"
            id="scene-image"
            tabindex="-1"
            src="Line_1_Onyangoncheon_Station/1.webp"
            alt="온양온천역 사진 1번"
            fetchpriority="high"
          />
          <button class="coupon-hotspot" id="coupon-hotspot" type="button" aria-label="쿠폰 보기" hidden>
            <img src="Coupon/할인_버튼.png" alt="" />
          </button>
          <div class="direction-controls" aria-label="이동 방향 선택">
            <button class="nav-arrow nav-up" id="up-button" type="button" aria-label="다음 사진으로 이동" title="다음 사진으로 이동" hidden>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5m0 0L6.5 10.5M12 5l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="nav-arrow nav-down" id="down-button" type="button" aria-label="이전 사진으로 이동" title="이전 사진으로 이동">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14m0 0 5.5-5.5M12 19l-5.5-5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="nav-arrow nav-left" id="left-button" type="button" aria-label="왼쪽 사진으로 이동" title="왼쪽 사진으로 이동" hidden>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m0 0 5.5-5.5M5 12l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="nav-arrow nav-right" id="right-button" type="button" aria-label="오른쪽 사진으로 이동" title="오른쪽 사진으로 이동" hidden>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m0 0-5.5-5.5M19 12l-5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="nav-arrow nav-up-left" id="up-left-button" type="button" aria-label="왼쪽 위 사진으로 이동" title="왼쪽 위 사진으로 이동" hidden>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 19 5 5m0 0v7m0-7h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="nav-arrow nav-down-left" id="down-left-button" type="button" aria-label="왼쪽 아래 사진으로 이동" title="왼쪽 아래 사진으로 이동" hidden>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 5 5 19m0 0v-7m0 7h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="nav-arrow nav-up-right" id="up-right-button" type="button" aria-label="오른쪽 위 사진으로 이동" title="오른쪽 위 사진으로 이동" hidden>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19 19 5m0 0h-7m7 0v7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="nav-arrow nav-down-right" id="down-right-button" type="button" aria-label="오른쪽 아래 사진으로 이동" title="오른쪽 아래 사진으로 이동" hidden>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5 19 19m0 0v-7m0 7h-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
          </div>
          <div class="coupon-screen" id="coupon-screen" aria-label="할인 쿠폰" hidden>
            <div class="coupon-card">
              <img class="coupon-image" src="Coupon/Coupon_QR.png" alt="3,000원 이상 구매 시 10% 할인 쿠폰 QR 코드" />
              <button class="coupon-close" id="coupon-back" type="button" aria-label="쿠폰 닫기" title="쿠폰 닫기">×</button>
            </div>
          </div>
          <div class="photo-error" id="photo-error" role="alert" hidden></div>
          </section>
        </section>
      </main>
    </div>

    <script>
      const image = document.querySelector("#scene-image");
      const searchScreen = document.querySelector("#search-screen");
      const journeyScreen = document.querySelector("#journey-screen");
      const exitScreen = document.querySelector("#exit-screen");
      const directionScreen = document.querySelector("#direction-screen");
      const guideScreen = document.querySelector("#guide-screen");
      const searchInput = document.querySelector("#station-search");
      const stationResults = document.querySelector("#station-results");
      const resultsCount = document.querySelector("#results-count");
      const backToSearch = document.querySelector("#back-to-search");
      const guideStationName = document.querySelector("#guide-station-name");
      const photoError = document.querySelector("#photo-error");
      const directionControls = document.querySelector(".direction-controls");
      const couponHotspot = document.querySelector("#coupon-hotspot");
      const couponScreen = document.querySelector("#coupon-screen");
      const couponBack = document.querySelector("#coupon-back");
      const buttons = {
        up: document.querySelector("#up-button"),
        down: document.querySelector("#down-button"),
        left: document.querySelector("#left-button"),
        right: document.querySelector("#right-button"),
        upLeft: document.querySelector("#up-left-button"),
        downLeft: document.querySelector("#down-left-button"),
        upRight: document.querySelector("#up-right-button"),
        downRight: document.querySelector("#down-right-button"),
      };
      let currentPhoto = null;
      let photoHistory = [];
      let activeStation = null;
      let activeMode = null;
      let couponIsOpen = false;
      const onyangRoutes = {
        1: { left: 2, right: 3 },
        2: { up: 4 },
        3: { up: 9 },
        4: { up: 7 },
        7: { up: 14 },
        9: { up: 10 },
        10: { up: 15 },
        14: { up: 20 },
        15: { up: 20 },
        18: { up: 45 },
        19: { up: 45 },
        20: { up: 45 },
        22: { up: 18 },
        24: { left: 25, right: 26 },
        25: { up: 28 },
        26: { up: 22 },
        28: { up: 19 },
        30: { up: 31 },
        31: { up: 32 },
        32: { left: 33, right: 34 },
        33: { up: 36 },
        34: { up: 35 },
        45: { up: 30 },
      };
      const onyangAlightRoutes = {
        38: { up: 42 },
        40: { up: 41 },
        41: { up: 43 },
        42: { up: 43 },
        43: { up: 44 },
        44: { up: 46 },
        46: { upLeft: 47, downLeft: 49, upRight: 16, downRight: 48 },
        47: { up: 16 },
        16: { up: 21 },
        21: { up: 23 },
        23: {},
        49: { up: 17 },
        17: { up: 27 },
        27: { up: 29 },
        29: {},
        11: { up: 53 },
        53: {},
        13: { up: 27 },
        48: { up: 13 },
      };
      const sinchangRoutes = {
        1: { left: 3, right: 2 },
        2: { down: 1 },
        3: { up: 4, down: 1 },
        4: { up: 6, down: 3 },
        6: { up: 7, down: 4 },
        7: { left: 22, up: 23, down: 6 },
        8: { up: 9, down: 22 },
        9: { up: 10, left: 14 },
        10: { left: 11, right: 12 },
        11: { down: 10 },
        12: { up: 13, down: 10 },
        13: { up: 24, down: 12, right: 14 },
        14: { left: 13, up: 15 },
        15: { up: 14, down: 17 },
        17: { up: 15, right: 18 },
        18: { left: 17, up: 20 },
        20: { up: 18, down: 25 },
        21: { up: 20, down: 22 },
        22: { left: 8, right: 21, down: 7 },
        23: { up: 29, right: 26, down: 22 },
        24: { left: 20, up: 23, down: 13 },
        25: { left: 20, up: 23 },
        26: { up: 6, down: 23 },
        28: { up: 23, down: 29 },
        29: { up: 30, down: 28 },
        30: { up: 32, down: 29 },
        31: { up: 28, down: 38 },
        32: { left: 36, right: 30 },
        36: { up: 39, down: 32 },
        38: { up: 31, down: 40 },
        39: { down: 40 },
        40: { up: 38 },
      };
      const stations = [
        {
          name: "온양온천역",
          line: "1호선",
          lineNumber: "1",
          area: "충청남도 아산시",
          searchTerms: ["온양온천역", "온양온천", "온양", "1호선"],
          folder: "Line_1_Onyangoncheon_Station",
          extension: "webp",
          photoCount: 52,
          requiresDirection: true,
          startPhotos: [1, 24],
          routes: onyangRoutes,
          alightRoutes: onyangAlightRoutes,
        },
        {
          name: "신창역",
          line: "1호선",
          lineNumber: "1",
          area: "충청남도 아산시",
          searchTerms: ["신창역", "신창"],
          folder: "Line_1_Sinchang_Station",
          extension: "webp",
          photoCount: 40,
          requiresDirection: false,
          startPhotos: [1],
          routes: sinchangRoutes,
        },
      ];

      function renderStationResults(query = "") {
        const normalizedQuery = query.toLocaleLowerCase("ko-KR").replace(/\s/g, "");
        const filteredStations = stations.filter((station) => (
          !normalizedQuery || station.searchTerms.some((term) => {
            const normalizedTerm = term.toLocaleLowerCase("ko-KR").replace(/\s/g, "");
            return normalizedTerm.includes(normalizedQuery) || normalizedQuery.includes(normalizedTerm);
          })
        ));

        stationResults.replaceChildren();
        resultsCount.textContent = `${filteredStations.length}개 역`;

        if (filteredStations.length === 0) {
          const emptyMessage = document.createElement("div");
          emptyMessage.className = "empty-results";
          emptyMessage.textContent = "검색 결과가 없습니다. 역 이름이나 호선을 다시 확인해 주세요.";
          stationResults.append(emptyMessage);
          return;
        }

        filteredStations.forEach((station) => {
          const resultButton = document.createElement("button");
          resultButton.className = "station-result";
          resultButton.type = "button";
          resultButton.setAttribute("aria-label", `${station.name}, ${station.line}, 길안내 시작`);
          resultButton.innerHTML = `
            <span class="line-number" aria-hidden="true">${station.lineNumber}</span>
            <span class="station-result-copy">
              <strong>${station.name}</strong>
              <span>${station.line} · ${station.area}</span>
            </span>
            <span class="result-arrow" aria-hidden="true">›</span>
          `;
          resultButton.addEventListener("click", () => {
            activeStation = station;
            activeMode = null;
            photoHistory = [];
            searchScreen.hidden = true;
            guideStationName.textContent = `${station.name} 길안내`;
            backToSearch.setAttribute(
              "aria-label",
              station.requiresDirection ? "방향 선택으로 돌아가기" : "역 검색으로 돌아가기",
            );
            backToSearch.lastChild.textContent = station.requiresDirection ? " 방향 선택" : " 역 검색";
            if (station.requiresDirection) {
              journeyScreen.hidden = false;
              return;
            }
            photoHistory = [];
            directionScreen.hidden = true;
            guideScreen.hidden = false;
            showPhoto(station.startPhotos[0]);
            image.focus({ preventScroll: true });
          });
          stationResults.append(resultButton);
        });
      }

      document.querySelector("#search-form").addEventListener("submit", (event) => {
        event.preventDefault();
        renderStationResults(searchInput.value);
        stationResults.querySelector(".station-result")?.focus();
      });

      searchInput.addEventListener("input", () => renderStationResults(searchInput.value));

      document.querySelector("#direction-back").addEventListener("click", () => {
        directionScreen.hidden = true;
        journeyScreen.hidden = false;
      });

      document.querySelector("#journey-back").addEventListener("click", () => {
        journeyScreen.hidden = true;
        searchScreen.hidden = false;
        searchInput.focus();
      });

      document.querySelector("#exit-back").addEventListener("click", () => {
        exitScreen.hidden = true;
        journeyScreen.hidden = false;
      });

      document.querySelectorAll("[data-journey]").forEach((button) => {
        button.addEventListener("click", () => {
          activeMode = button.dataset.journey;
          journeyScreen.hidden = true;
          if (activeMode === "ride") {
            directionScreen.hidden = false;
          } else {
            exitScreen.hidden = false;
          }
        });
      });

      document.querySelectorAll("[data-start-photo]").forEach((button) => {
        button.addEventListener("click", () => {
          if (!activeStation) {
            throw new Error("역을 먼저 선택해 주세요.");
          }
          startGuide(Number(button.dataset.startPhoto), "ride");
        });
      });

      document.querySelectorAll("[data-exit-start]").forEach((button) => {
        button.addEventListener("click", () => {
          startGuide(Number(button.dataset.exitStart), "alight");
        });
      });

      function startGuide(photo, mode) {
        photoHistory = [];
        activeMode = mode;
        journeyScreen.hidden = true;
        directionScreen.hidden = true;
        exitScreen.hidden = true;
        guideScreen.hidden = false;
        showPhoto(photo);
        image.focus({ preventScroll: true });
      }

      backToSearch.addEventListener("click", () => {
        guideScreen.hidden = true;
        photoHistory = [];
        if (activeStation?.requiresDirection) {
          if (activeMode === "ride") {
            directionScreen.hidden = false;
          } else if (activeMode === "alight") {
            exitScreen.hidden = false;
          } else {
            journeyScreen.hidden = false;
          }
        } else {
          currentPhoto = null;
          activeMode = null;
          searchScreen.hidden = false;
          searchInput.focus();
        }
      });

      function showPhoto(photo, remember = false) {
        const photoLimit = activeMode === "alight" ? 53 : activeStation?.photoCount;
        if (!activeStation || !Number.isInteger(photo) || photo < 1 || photo > photoLimit) {
          throw new RangeError(`잘못된 사진 번호입니다: ${photo}`);
        }
        if (remember && currentPhoto !== null) photoHistory.push(currentPhoto);
        currentPhoto = photo;
        couponIsOpen = false;
        couponScreen.hidden = true;
        image.classList.add("is-changing");
        image.src = `${activeStation.folder}/${photo}.${activeStation.extension}`;
        image.alt = `${activeStation.name} 사진 ${photo}번`;
        photoError.hidden = true;
        window.setTimeout(() => image.classList.remove("is-changing"), 120);
        renderArrows();
        positionCouponHotspot();
      }

      function renderArrows() {
        const routes = activeMode === "alight" ? activeStation?.alightRoutes : activeStation?.routes;
        const route = getCurrentRoute(routes);
        directionControls.hidden = couponIsOpen;
        Object.keys(buttons).forEach((direction) => {
          const usesHistoryBack = direction === "down"
            && photoHistory.length > 0
            && (activeMode === "alight" || activeStation?.requiresDirection);
          const returnsToDirection = activeStation?.requiresDirection
            && direction === "down"
            && activeMode === "ride"
            && activeStation.startPhotos.includes(currentPhoto);
          buttons[direction].hidden = route[direction] === undefined
            && !usesHistoryBack
            && !returnsToDirection;
        });
        buttons.down.setAttribute(
          "aria-label",
          activeStation?.requiresDirection && activeMode === "ride" && activeStation.startPhotos.includes(currentPhoto)
            ? "지하철 방향 선택으로 돌아가기"
            : route.down !== undefined || activeStation?.requiresDirection ? "이전 사진으로 이동" : "아래 사진으로 이동",
        );
        buttons.down.title = buttons.down.getAttribute("aria-label");
        couponHotspot.hidden = couponIsOpen || currentPhoto !== 33 || activeStation?.name !== "온양온천역";
        positionCouponHotspot();
      }

      function positionCouponHotspot() {
        if (currentPhoto !== 33 || !image.naturalWidth || !image.naturalHeight) return;
        const viewer = image.closest(".viewer");
        const scale = Math.max(viewer.clientWidth / image.naturalWidth, viewer.clientHeight / image.naturalHeight);
        const renderedWidth = image.naturalWidth * scale;
        const renderedHeight = image.naturalHeight * scale;
        const mobileCouponPosition = window.matchMedia("(max-width: 700px)").matches;
        const objectPositionX = mobileCouponPosition ? 1 : 0.5;
        const offsetX = (viewer.clientWidth - renderedWidth) * objectPositionX;
        const offsetY = (viewer.clientHeight - renderedHeight) * 0.5;
        image.style.objectPosition = mobileCouponPosition ? "right center" : "center";
        couponHotspot.style.left = `${offsetX + image.naturalWidth * 0.92 * scale}px`;
        couponHotspot.style.top = `${offsetY + image.naturalHeight * 0.326 * scale}px`;
      }

      couponHotspot.addEventListener("click", () => {
        couponIsOpen = true;
        couponScreen.hidden = false;
        renderArrows();
        couponBack.focus();
      });

      couponBack.addEventListener("click", () => {
        couponIsOpen = false;
        couponScreen.hidden = true;
        renderArrows();
        couponHotspot.focus();
      });

      window.addEventListener("resize", positionCouponHotspot);
      function move(direction) {
        if (direction === "down") {
          const routes = activeMode === "alight" ? activeStation?.alightRoutes : activeStation?.routes;
          const nextPhoto = getCurrentRoute(routes).down;
          if (nextPhoto !== undefined) {
            showPhoto(nextPhoto, true);
            return;
          }
          if (activeStation?.requiresDirection
            && activeMode === "ride"
            && activeStation.startPhotos.includes(currentPhoto)) {
            guideScreen.hidden = true;
            directionScreen.hidden = false;
            currentPhoto = null;
            return;
          }
          if (photoHistory.length === 0) return;
          showPhoto(photoHistory.pop());
          return;
        }
        const routes = activeMode === "alight" ? activeStation?.alightRoutes : activeStation?.routes;
        const nextPhoto = getCurrentRoute(routes)[direction];
        if (nextPhoto !== undefined) showPhoto(nextPhoto, true);
      }

      function getCurrentRoute(routes) {
        const route = routes?.[currentPhoto] || {};
        if (activeMode === "alight" && currentPhoto === 16 && photoHistory[photoHistory.length - 1] === 46) {
          return { ...route, up: 11 };
        }
        return route;
      }

      document.addEventListener("keydown", (event) => {
        if (guideScreen.hidden || event.target instanceof HTMLInputElement || event.target instanceof HTMLButtonElement) return;
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        const direction = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[event.key];
        if (direction) {
          event.preventDefault();
          move(direction);
        }
      });

      Object.entries(buttons).forEach(([direction, button]) => {
        button.addEventListener("click", () => move(direction));
      });
      image.addEventListener("load", () => {
        image.classList.remove("is-changing");
        photoError.hidden = true;
        positionCouponHotspot();
      });
      image.addEventListener("error", () => {
        photoError.textContent = `사진 ${currentPhoto}번을 불러오지 못했습니다. ${activeStation?.folder}/${currentPhoto}.${activeStation?.extension} 파일을 확인해 주세요.`;
        photoError.hidden = false;
      });
      renderStationResults();
    </script>
  </body>
</html>
